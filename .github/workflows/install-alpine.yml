name: Install on Alpine Linux

on:
  - push
  - pull_request

jobs:
  install:
    runs-on: ubuntu-latest
    container: alpine:latest
    strategy:
      matrix:
        shell:
          - bash
          - dash
          - sh
          # - zsh
        pnpm_version:
          - '10.30.1'  # v10: single-binary download
          - 'next-11'  # v11: tarball download
          - 'next-12'  # v12: verified npm registry download
        script:
          - install.sh
      fail-fast: false

    steps:
      - uses: actions/checkout@v2
      - name: Install shell
        run: apk add ${{ matrix.shell }}
        if: ${{ matrix.shell != 'sh' }}
      - name: Install pnpm runtime dependencies
        # The unofficial musl Node.js build (nodejs/unofficial-builds) pnpm
        # embeds in its standalone binary isn't fully statically linked — it
        # has dynamic deps on libstdc++.so.6 and libgcc_s.so.1. They aren't in
        # the minimal alpine:latest image by default, so install them here
        # before running the install script. See pnpm/pnpm#11317.
        run: apk add libstdc++ libgcc
      - name: Run installation script
        env:
          PNPM_HOME: /tmp/pnpm-home
          PNPM_VERSION: ${{ matrix.pnpm_version }}
        run: ENV="~/.${{ matrix.shell }}rc" SHELL="$(which ${{ matrix.shell }})" ${{ matrix.shell }} ${{ matrix.script }}
      - name: Verify pnpm works
        env:
          PNPM_VERSION: ${{ matrix.pnpm_version }}
        run: |
          # Prove the cell installed the major it selects. Without this a
          # mis-wired PNPM_VERSION falls back to `latest`, and a cell that
          # exists to exercise one code path passes while testing another.
          case "$PNPM_VERSION" in
            [0-9]*) expected_major="${PNPM_VERSION%%.*}" ;;
            *) expected_major="${PNPM_VERSION##*-}" ;;
          esac
          export PATH="/tmp/pnpm-home/bin:/tmp/pnpm-home:$PATH"
          installed="$(PNPM_HOME=/tmp/pnpm-home pnpm --version)"
          if [ "${installed%%.*}" != "$expected_major" ]; then
            echo "expected pnpm $expected_major.x, got $installed" >&2
            exit 1
          fi
          tmpdir=$(mktemp -d)
          cd "$tmpdir"
          echo '{}' > package.json
          # v10 pnpm setup places the binary at $PNPM_HOME/pnpm; v11+ at
          # $PNPM_HOME/bin/pnpm. Prepend both so the verify step works across
          # every test matrix cell.
          PATH="/tmp/pnpm-home/bin:/tmp/pnpm-home:$PATH" PNPM_HOME=/tmp/pnpm-home pnpm add webpack
          test -f node_modules/webpack/package.json
